<div class="p-4">
  <div class="d-flex flex-row justify-content-between">
    <div>
      <h3>Categorias</h3>
      <span>Organize seu cardápio em categorias.</span>
    </div>

    <app-button label="Novo Categoria" iconName="plus" (click)="openModal()"></app-button>
  </div>

   <div class="mt-3 d-flex flex-row gap-3">
      <div class="card col-lg-4 col-md-4 col-sm-12 col-xs-12 p-3 mb-3" *ngFor="let categories of categoriesList" style="min-width: 300px;">
        <div class="d-flex flex-row justify-content-between align-items-center">
           <button class="btn btn-without-border" (click)="editCategory(categories)">
            <i class="pi pi-pencil"></i>
          </button>

          <p-toggle-switch class="ml-auto" [(ngModel)]="categories.isActive" (ngModelChange)="onChangeStatus(categories)" ></p-toggle-switch>
        </div>

        <div class="mt-2 d-flex flex-column">
          <span>{{ categories.name }}</span>
          <span class="text-secondary">{{ categories.description }} </span>
        </div>
      </div>
   </div>
</div>

<p-dialog [header]="isEditMode ? 'Editar Categoria' : 'Nova Categoria'" [modal]="true" [(visible)]="modalOpen" [style]="{ width: '25rem' }">
  <form [formGroup]="formGroup">
    <div class="d-flex flex-column gap-3 justify-content-center align-items-center">
      <p-floatlabel variant="on" class="mt-2 ">
        <input type="text" pInputText formControlName="name" [invalid]="formGroup.get('name')?.invalid && formGroup.get('name')?.touched" />
        <label for="on_label">Nome da Categoria *</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <input type="text" pInputText formControlName="description" [invalid]="formGroup.get('description')?.invalid && formGroup.get('description')?.touched" />
        <label for="on_label">Descrição da Categoria *</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <input pInputText formControlName="order" type="number" [invalid]="formGroup.get('order')?.invalid && formGroup.get('order')?.touched" />
        <label for="on_label">Ordem da Categoria *</label>
      </p-floatlabel>

      <div class="d-flex flex-row gap-2 align-items-center">
        <label>Status</label>
        <p-toggleswitch formControlName="isActive"></p-toggleswitch>
      </div>
    </div>
  </form>
  <div class="d-flex flex-row justify-content-center gap-3 mt-5">
    <button type="button" class="btn btn-danger" (click)="closeModal()">Cancelar</button>
    <button  type="button" class="btn btn-primary" (click)="save()">Salvar</button>
  </div>
</p-dialog>
