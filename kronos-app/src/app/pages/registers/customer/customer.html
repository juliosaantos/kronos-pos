<div class="p-4">
  <div class="d-flex flex-row justify-content-between">
    <div>
      <h3>Clientes</h3>
      <span>Cadastro e histórico de clientes na sua loja.</span>
    </div>

    <app-button label="Novo Cliente" iconName="plus" (click)="openModal()"></app-button>
  </div>

  <div class="mt-3 w-100">
    <div class="d-flex flex-row gap-3 align-items-center">
      <p-iconfield class="search-iconfield w-50">
        <p-inputicon class="pi pi-search" />
        <input type="text" pInputText placeholder="Pesquisar clientes por nome ou telefone" class="search-input" (input)="onSearchCustomers($event)" />
      </p-iconfield>
    </div>
  </div>

  <div class="mt-3 d-flex flex-row flex-wrap gap-3">
    <div *ngFor="let customer of filteredCustomers" class="card col-lg-4 col-md-5 col-sm-12 p-3 my-3" style="min-width: 300px">
      <div class="d-flex flex-row align-items-center justify-content-between">
        <div class="d-flex flex-row align-items-center gap-2">
          <span class="rounded-letter">{{ getInitLetterFullName(customer.firstName, customer.lastName) }}</span>
          <span>{{ customer.firstName }} {{ customer.lastName }}</span>
        </div>

        <button class="btn btn-without-border" (click)="editCustomer(customer)">
          <i class="pi pi-pencil"></i>
        </button>
      </div>

      <div class="px-5">
        <i class="pi pi-phone small-icon"></i>
        <span class="text-secondary px-2" style="font-size: small">{{ customer.phone }}</span>
      </div>

      <div class="px-5">
        <i class="bi bi-geo-alt small-icon"></i>
        <span class="text-secondary px-2" style="font-size: small">{{ customer.address }} {{ customer.number }}, {{ customer.neighborhood.name }}</span>
      </div>
    </div>
  </div>
</div>

<p-dialog [header]="isEditMode ? 'Editar Produto' : 'Novo Produto'" [modal]="true" [(visible)]="modalOpen" [style]="{ width: '25rem' }">
  <form [formGroup]="formGroup">
    <div class="d-flex flex-column gap-3 justify-content-center align-items-center">
      <p-floatlabel variant="on" class="mt-2">
        <input pInputText type="text" formControlName="firstName" [invalid]="formGroup.get('firstName')?.invalid && formGroup.get('firstName')?.touched" />
        <label for="on_label">Nome *</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <input pInputText type="text" formControlName="lastName" [invalid]="formGroup.get('lastName')?.invalid && formGroup.get('lastName')?.touched" />
        <label for="on_label">Sobrenome *</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <p-input-mask type="text" formControlName="phone" mask="(99) 99999-9999" [unmask]="true" [invalid]="formGroup.get('phone')?.invalid && formGroup.get('phone')?.touched" />
        <label for="on_label">Telefone *</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <input pInputText type="text" formControlName="email" [invalid]="formGroup.get('email')?.invalid && formGroup.get('email')?.touched" />
        <label for="on_label">Email *</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <p-input-mask
          type="text"
          formControlName="document"
          mask="999.999.999-99"
          [unmask]="true"
          [invalid]="formGroup.get('document')?.invalid && formGroup.get('document')?.touched"
        />
        <label for="on_label">Documento *</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <input pInputText type="text" formControlName="address" [invalid]="formGroup.get('address')?.invalid && formGroup.get('address')?.touched" />
        <label for="on_label">Endereço *</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <input pInputText type="text" formControlName="number" [invalid]="formGroup.get('number')?.invalid && formGroup.get('number')?.touched" />
        <label for="on_label">Número *</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <input pInputText type="text" formControlName="complement" />
        <label for="on_label">Complemento</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <input pInputText type="text" formControlName="reference" />
        <label for="on_label">Referência</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <p-select
          formControlName="neighborhoodId"
          [options]="neighborhoodList"
          optionLabel="name"
          optionValue="id"
          class="w-100"
          [invalid]="formGroup.get('neighborhoodId')?.invalid && formGroup.get('neighborhoodId')?.touched"
        />
        <label for="on_label">Bairro *</label>
      </p-floatlabel>

      <div class="d-flex flex-row gap-2 align-items-center">
        <label>Status</label>
        <p-toggleswitch formControlName="isActive"></p-toggleswitch>
      </div>
    </div>
  </form>

  <div class="d-flex flex-row justify-content-center gap-3 mt-5">
    <button type="button" class="btn btn-danger" (click)="closeModal()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="save()">Salvar</button>
  </div>
</p-dialog>
