<div class="p-4">
  <div class="d-flex flex-row justify-content-between">
    <div>
      <h3>Bairros</h3>
      <span>Cadastro e histórico de bairros na sua loja.</span>
    </div>

    <app-button label="Novo Bairro" iconName="plus" (click)="openModal()"></app-button>
  </div>

  <div class="mt-3">
    <div>
      <p-iconfield class="search-iconfield">
        <p-inputicon class="pi pi-search" />
        <input type="text" pInputText placeholder="Pesquisar produtos" class="search-input" (input)="onSearchList($event)" />
      </p-iconfield>
    </div>
  </div>

  <div class="mt-3 d-flex flex-row gap-3">
    <div class="card col-lg-2 col-md-4 col-sm-12 col-xs-12 p-3 mb-3" style="min-width: 300px;" *ngFor="let neighborhod of filteredNeighborhoodsList">
      <div class="d-flex flex-row justify-content-between align-items-center">
        <p-toggleswitch [(ngModel)]="neighborhod.isActive" (onChange)="toggleStatus(neighborhod)"></p-toggleswitch>

        <button class="btn btn-without-border" (click)="editNeighborhood(neighborhod)">
            <i class="pi pi-pencil"></i>
        </button>
      </div>

      <div class="mt-2 d-flex flex-row gap-2">
        <i class="bi bi-geo-alt"></i>
        <h5 class="fw-bold">{{ neighborhod.name }}</h5>
      </div>

      <div class="mt-2 d-flex flex-row justify-content-between align-items-center gap-3">
        <div class="d-flex flex-column">
          <span class="text-secondary">Taxa</span>
          <span class="span-price">{{ neighborhod.deliveryFee | currency: 'BRL' }}</span>
        </div>

        <div class="d-flex flex-column">
          <span class="text-secondary">Tempo de entrega</span>

          <div>
            <i class="bi bi-clock text-secondary"></i>
            <span class="px-2">{{ neighborhod.estimatedDeliveryTime }}min</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<p-dialog [header]="isEditMode ? 'Editar Produto' : 'Novo Produto'" [modal]="true" [(visible)]="modalOpen" [style]="{ width: '25rem' }">
  <form [formGroup]="formGroup">
    <div class="d-flex flex-column gap-3 justify-content-center align-items-center">
      <p-floatlabel variant="on" class="mt-2">
        <input pInputText type="text" formControlName="name" [invalid]="formGroup.get('name')?.invalid && formGroup.get('name')?.touched" />
        <label for="on_label">Nome *</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <p-input-number formControlName="deliveryFee" mode="currency" currency="BRL" locale="pt-BR" class="w-100" [invalid]="formGroup.get('deliveryFee')?.invalid && formGroup.get('deliveryFee')?.touched"></p-input-number>
        <label for="on_label">Taxa de entrega *</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <input pInputText type="number" formControlName="estimatedDeliveryTime" [invalid]="formGroup.get('estimatedDeliveryTime')?.invalid && formGroup.get('estimatedDeliveryTime')?.touched" />
        <label for="on_label">Tempo de entrega estimado (minutos) *</label>
      </p-floatlabel>

      <div class="d-flex flex-row gap-2 align-items-center">
        <label>Status</label>
        <p-toggleswitch formControlName="isActive"></p-toggleswitch>
      </div>
    </div>
  </form>

  <div class="d-flex flex-row justify-content-center gap-3 mt-5">
    <button type="button" class="btn btn-danger" (click)="closeModal()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="save()">Salvar</button>
  </div>
</p-dialog>
